<svg xmlns="http://www.w3.org/2000/svg" width="880" height="187" viewBox="0 0 880 187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes on{0%,99%{opacity:1}100%{opacity:0}}
@keyframes stay{to{opacity:1}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

</style>
