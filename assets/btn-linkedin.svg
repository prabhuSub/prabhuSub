<svg xmlns="http://www.w3.org/2000/svg" width="260" height="60" viewBox="0 0 260 60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes on{0%,99%{opacity:1}100%{opacity:0}}
@keyframes stay{to{opacity:1}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade .7s ease-out forwards}


</style>
<g transform="translate(0 16)"><rect x="1" y="1" width="258" height="42" rx="6" fill="#f4f4f4"/>
<text x="130" y="27" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.2" fill="#171a20">CONNECT ON LINKEDIN</text></g>
</svg>